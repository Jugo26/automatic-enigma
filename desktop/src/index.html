<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data:; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>GrepoPilot Desktop</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="toolbar"><div class="brand"><span class="crest">♜</span><span><strong>GREPOPILOT</strong><small>DESKTOP <b id="app-version">...</b></small></span></div><div class="browser-controls"><button data-nav="back" title="Voltar">‹</button><button data-nav="forward" title="Avançar">›</button><button data-nav="reload" title="Atualizar manualmente">↻</button><form id="address-form"><input id="address" spellcheck="false" aria-label="Endereço ou pesquisa" placeholder="Grepolis ou pesquise no Google"><button type="submit" title="Ir">↵</button></form></div><div id="engine-status" class="engine-status">Abra um mundo do Grepolis</div></header>
<nav id="nav" class="sidebar" aria-label="Módulos GrepoPilot"></nav><main id="game-space" class="game-space"><span>Aqui aparece o Grepolis.</span></main>
<aside class="panel"><div class="panel-top"><div id="panel-heading"></div><div class="city-select"><label for="city">Cidade ativa</label><select id="city"><option value="">Conecte-se ao Grepolis</option></select></div></div><div id="panel-content" class="panel-content"></div><footer class="panel-footer"><span id="state-text">Sem sessão</span><span id="update-status">motor remoto · sem F5 automático</span></footer></aside>
<div id="toast" role="status" aria-live="polite"></div><script src="renderer.js"></script></body></html>
