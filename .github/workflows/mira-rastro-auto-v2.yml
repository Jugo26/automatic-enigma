name: Build Mira Rastro 8 Ball APK
on:
  push:
    branches: [build-mira-rastro-auto-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar projeto
        run: mkdir -p mira-android && tar -xJf mira_auto/source.tar.xz -C mira-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar plataformas Android com SDK do runner
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK: ${SDKROOT}"
          find "${SDKROOT}" -maxdepth 5 -name sdkmanager -type f || true
          SM="$(find "${SDKROOT}" -maxdepth 5 -name sdkmanager -type f | head -1)"
          if [ -n "${SM}" ]; then
            "${SM}" --install "platforms;android-35" "build-tools;35.0.0"
          else
            echo "SDK Manager nao presente; Gradle verificara plataformas preinstaladas"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testes de física
        working-directory: mira-android
        run: bash tools/test-physics.sh
      - name: Teste do detector
        working-directory: mira-android
        run: |
          mkdir -p /tmp/mira-detect
          javac -d /tmp/mira-detect app/src/main/java/com/kindmops/mirarastro/FrameDetector.java tools/TestFrameDetector.java
          java -cp /tmp/mira-detect TestFrameDetector
      - name: Compilar APK
        working-directory: mira-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraRastro8Ball-AUTO-v2-APK
          path: mira-android/app/build/outputs/apk/debug/app-debug.apk
