name: GrepoPilot Desktop Windows release
on:
  push:
    branches: [grepopilot-updates]
    paths:
      - 'releases/GrepoPilot-Desktop-*.zip'
      - '.github/workflows/grepopilot-desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack desktop source
        shell: pwsh
        run: |
          Expand-Archive -Path 'releases/GrepoPilot-Desktop-v0.2.4-central-compartilhada.zip' -DestinationPath '.' -Force
          Move-Item -Path 'GrepoPilot-Desktop-v0.2.4' -Destination 'desktop'
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test Desktop
        working-directory: desktop
        run: npm run check
      - name: Test central server
        working-directory: desktop/shared-server
        run: npm test
      - name: Build Windows NSIS installer and latest.yml
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Read Desktop version
        id: version
        shell: bash
        run: echo "number=$(node -p 'require("./desktop/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Publish auto-update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          name: GrepoPilot Desktop v${{ steps.version.outputs.number }}
          target_commitish: grepopilot-updates
          generate_release_notes: true
          make_latest: true
          files: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
